name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          VER=$(grep -oP 'val appVersion = "\K[^"]+' client/composeApp/build.gradle.kts)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          # automatic release: push to main with a version that has no tag yet
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ] && \
             [ -z "$(git ls-remote --tags origin "refs/tags/v$VER")" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Version $VER"

  agent:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Vet & build
        working-directory: agent
        run: |
          go vet ./...
          go test ./...
          VER="${{ needs.meta.outputs.version }}"
          echo "Agent-Version: $VER"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$VER" -o ../dist/servercontrol-agent-linux-$arch .
          done
      - name: Package
        run: |
          mkdir -p pkg && cp dist/* deploy/* pkg/
          tar -C pkg -czf servercontrol-agent.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: servercontrol-agent
          path: servercontrol-agent.tar.gz

  android:
    needs: [meta, agent]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # no agent binary inside the APK (Play Protect): the app downloads it from the release
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key from secrets (optional)
        env:
          KS: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > $RUNNER_TEMP/release.keystore; echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV; echo "Signing: key from secrets"; else echo "Signing: key from repository"; fi
      - name: Build APK
        working-directory: client
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :composeApp:assembleRelease
          cp composeApp/build/outputs/apk/release/composeApp-release.apk ../ServerControl.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ServerControl-android
          path: ServerControl.apk

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            task: packageReleaseDeb
            glob: client/composeApp/build/compose/binaries/main-release/deb/*.deb
            name: ServerControl-linux-deb
          - os: windows-latest
            task: packageReleaseMsi
            glob: client/composeApp/build/compose/binaries/main-release/msi/*.msi
            name: ServerControl-windows-msi
    needs: [meta, agent]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: servercontrol-agent
          path: client/composeApp/src/desktopMain/resources/agent
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Package
        working-directory: client
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :composeApp:${{ matrix.task }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.glob }}

  # Release: either for a manually created tag, or automatically when the version
  # in build.gradle.kts was raised on main (creates tag v<version> on this commit).
  release:
    if: startsWith(github.ref, 'refs/tags/v') || needs.meta.outputs.release == 'true'
    needs: [meta, agent, android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.meta.outputs.version }}
          name: ServerControl ${{ needs.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: out/**/*
